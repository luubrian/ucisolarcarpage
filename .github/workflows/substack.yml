name: Refresh Substack posts

on:
  schedule:
    - cron: '0 */6 * * *'      # every 6 hours
  workflow_dispatch:            # manual "Run workflow" button
  push:
    paths:
      - 'scripts/fetch-substack.mjs'
      - '.github/workflows/substack.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch latest posts
        run: node scripts/fetch-substack.mjs
      - name: Commit posts.json if it changed
        run: |
          if ! git diff --quiet -- posts.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add posts.json
            git commit -m "Refresh Substack posts"
            git push
          else
            echo "posts.json unchanged"
          fi
